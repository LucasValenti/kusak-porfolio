<!doctype html>
<html lang="es" class="con-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Imagen para redes</title>
<!-- Fuente de assets/og.png. Se abre servida desde la raíz del proyecto
     (http://127.0.0.1:8766/herramientas/og/og.html), con la ventana en 1200x630
     y movimiento reducido, y se captura la ventana entera. -->
<link rel="stylesheet" href="../../assets/estilo.css">
<link rel="stylesheet" href="og.css">
</head>
<body>
  <div class="og">
    <div class="ventana og__bienvenida">
      <div class="ventana__titulo">
        <img class="ventana__icono" src="../../assets/marca/kusak-icono.svg" alt="">
        <p class="ventana__nombre">Bienvenido a KUSAK</p>
      </div>
      <div class="ventana__cuerpo">
        <p class="logo"><img src="../../assets/marca/kusak-icono.svg" alt="">KUSAK</p>
        <h1>Páginas web para tu negocio.</h1>
        <p class="og__bajada">Lucas Valenti · Rosario, Argentina</p>
        <p class="acciones"><span class="boton boton--accion">Escribime por WhatsApp</span></p>
      </div>
    </div>
    <div class="ventana ventana--navegador ventana--inactiva og__gea">
      <div class="ventana__titulo"><p class="ventana__nombre">GEA Insumos</p></div>
      <div class="ventana__cuerpo">
        <div class="navegador__barra"><span class="navegador__direccion">https://geainsumos.com/</span></div>
        <div class="captura"><img src="../../assets/trabajos/gea-escritorio-750.webp" alt=""></div>
      </div>
    </div>
    <div class="tareas og__tareas">
      <span class="tareas__kusak"><img src="../../assets/marca/kusak-icono.svg" alt="">KUSAK</span>
      <span class="og__hueco"></span>
      <span class="tareas__wa">WhatsApp 341 500-0651</span>
    </div>
  </div>
</body>
</html>
