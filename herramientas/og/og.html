<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Imagen para redes</title>
<!-- Fuente de assets/og.png. Se abre servida desde la raíz del proyecto
     (http://127.0.0.1:8765/herramientas/og/og.html), con la ventana en 1200x630
     y movimiento reducido, y se captura la ventana entera. -->
<style>
  @font-face { font-family: 'Shippori Mincho'; src: url('../../assets/fonts/shippori-mincho-700-latin.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Zen Kaku Gothic New'; src: url('../../assets/fonts/zen-kaku-gothic-new-700-latin.woff2') format('woff2'); font-weight: 700; }

  :root {
    --washi: #f1e9d8;
    --sumi: #151923;
    --tinta-2: #4a5263;
    --bermellon: #b94735;
    --margen: 72px;
    --horizonte: 498px; /* el filete que separa el cartel de la firma */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: var(--washi);
    color: var(--sumi);
  }

  /* Titular: el cartel habla solo, sin rótulo arriba */
  h1 {
    position: absolute;
    left: var(--margen);
    top: 84px;
    margin: 0;
    font: 700 104px/1 'Shippori Mincho', serif;
    letter-spacing: -0.02em;
  }
  h1 span { display: block; }
  /* La tienda de GEA, como la tarjeta del inicio: un trabajo real, no una ilustración */
  .tarjeta {
    position: absolute;
    left: 744px;
    top: 56px;
    width: 384px;
    height: 400px;
    overflow: hidden;
    border-radius: 16px;
    background: #fbf7ef;
    box-shadow: 0 0 0 1px rgba(21, 25, 35, .14), 0 36px 60px -34px rgba(21, 25, 35, .55);
  }
  .tarjeta img { display: block; width: 100%; height: auto; }

  .filete {
    position: absolute;
    left: var(--margen);
    right: var(--margen);
    top: var(--horizonte);
    height: 2px;
    background: var(--sumi);
  }

  /* Firma: el logo y dónde encontrarlo */
  .firma {
    position: absolute;
    left: var(--margen);
    right: var(--margen);
    top: calc(var(--horizonte) + 34px);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .firma img { display: block; height: 64px; width: auto; }
  .firma p {
    margin: 0;
    font: 700 19px/1.3 'Zen Kaku Gothic New', sans-serif;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--tinta-2);
    text-align: right;
  }
  .firma strong { color: var(--sumi); font-weight: 700; }
</style>
</head>
<body>
  <div class="tarjeta"><img src="../../assets/trabajos/gea-escritorio-750.webp" alt=""></div>

  <h1><span>Páginas web</span><span>para tu</span><span>negocio.</span></h1>

  <div class="filete"></div>

  <div class="firma">
    <img src="../../assets/marca/kusak.svg" alt="KUSAK · SŌ Studio">
    <p>Rosario, Argentina<br><strong>Escribime por WhatsApp</strong></p>
  </div>

</body>
</html>
